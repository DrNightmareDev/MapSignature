<script>
const sys=[...document.querySelectorAll('.systems .sys:not(.ext)')], tip=document.getElementById('tip');
sys.forEach(g=>{g.querySelector('title')?.remove();
 g.addEventListener('mousemove',e=>{const d=g.dataset;tip.textContent=d.name+'  ('+d.const+')  sec '+d.sec+'\nSov: '+(d.owner||'-')+'\nThreat Detection: '+(d.tda||'-')+'\nProspecting: '+(d.pa&&d.pa!=='N/A'?d.pa:'-');
  tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-260)+'px';tip.style.top=(e.clientY+14)+'px'});
 g.addEventListener('mouseleave',()=>tip.style.display='none')});
function apply(){const f=document.getElementById('f').value,q=document.getElementById('q').value.trim().toLowerCase();let n=0;
 sys.forEach(g=>{const d=g.dataset;let ok=true;
  if(f==='pa')ok=!!d.min;else if(f==='MAJ3')ok=d.tda.includes('MAJ3');else if(f==='MIN')ok=d.tda.includes('MIN');else if(f)ok=d.min===f;
  if(q)ok=ok&&(d.name.toLowerCase().includes(q)||d.const.toLowerCase().includes(q));
  g.classList.toggle('dim',!ok);if(ok)n++});
 document.getElementById('count').textContent=n+' von '+sys.length+' Systemen'}
document.getElementById('f').onchange=apply;document.getElementById('q').oninput=apply;apply();
</script></body></html>
